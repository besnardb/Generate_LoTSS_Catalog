[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "generate_lotss_catalog"
version = "0.1.0"
description = "Library to enable GPU-accelerated, xarray-based direction-dependant radio-interferometric calibration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.2.0",
    "attrs>=26.1.0",
    "dask>=2026.8.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pint>=0.25.3",
    "pint-xarray",
    "pytest>=9.0.2",
    "python-casacore>=3.7.1",
    "regions>=0.11",
    "tyro>=1.0.16",
    "xarray>=2025.6.0",
    "xarray-ms>=0.5.12",
    "xradio>=1.2.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["generate_lotss_catalog*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
